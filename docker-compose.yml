services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: picking
      POSTGRES_PASSWORD: picking
      POSTGRES_DB: picking
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/03_picking.sql:/docker-entrypoint-initdb.d/03_picking.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picking -d picking"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: .
    environment:
      PORT: ${PORT:-3000}
      PICK_LOCK_TTL_SECONDS: ${PICK_LOCK_TTL_SECONDS:-900}
      DATABASE_URL: postgres://picking:picking@postgres:5432/picking
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
